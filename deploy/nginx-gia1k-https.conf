# /etc/nginx/sites-available/gia1k — bản HTTPS hoàn chỉnh.
#
# ĐIỀU KIỆN trước khi dùng file này:
#   1) Đã tạo Cloudflare Origin Certificate và lưu vào VPS:
#        /etc/ssl/cloudflare/gia1k.com.pem   (Origin Certificate)
#        /etc/ssl/cloudflare/gia1k.com.key   (Private Key, chmod 600)
#   2) Cloudflare → SSL/TLS → đặt mode = Full (strict).  (KHÔNG dùng Flexible,
#      nếu không sẽ lặp redirect vô hạn.)
#
# Áp dụng:  sudo nginx -t && sudo systemctl reload nginx

# ── HTTP :80 → chuyển hết sang HTTPS ─────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name gia1k.com www.gia1k.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS :443 — phục vụ site ────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gia1k.com www.gia1k.com;

    ssl_certificate     /etc/ssl/cloudflare/gia1k.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/gia1k.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    root /home/ubuntu/s1k;
    index index.html;

    # data.json đổi mỗi giờ → không cache ở trình duyệt
    location = /data.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Chặn lộ file nội bộ (.git chứa token, crawler, db, script deploy…)
    location ~ /\.(?!well-known)                          { deny all; }
    location ~* \.(py|db|tmp|service|timer|sh|md|yml|txt)$ { deny all; }
}
