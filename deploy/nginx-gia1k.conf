# Gia1K — site tĩnh phục vụ bởi nginx, đứng sau Cloudflare (proxied).
# Cài: copy file này vào /etc/nginx/sites-available/gia1k rồi
#      ln -s /etc/nginx/sites-available/gia1k /etc/nginx/sites-enabled/gia1k
#      nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name gia1k.com www.gia1k.com;

    root /home/ubuntu/s1k;
    index index.html;

    # data.json đổi mỗi giờ → không cache ở trình duyệt
    location = /data.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Chặn lộ file nội bộ (crawler, db, script deploy…)
    location ~ /\.(?!well-known)          { deny all; }
    location ~* \.(py|db|tmp|service|timer|sh|md|yml|txt)$ { deny all; }
}

